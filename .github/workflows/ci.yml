name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  visual:
    # Runs inside Playwright's own published image rather than the bare
    # runner OS with Chromium installed separately — that combination
    # renders sub-pixel-different font/GL output from whatever machine
    # captured the committed baselines, a permanent environment mismatch,
    # not flakiness (found for real: every baseline PNG under
    # tests/visual/**/*-snapshots/ was off by ~1% of pixels against a bare
    # ubuntu-24.04 run once deploy-pages.yml's own container-based job had
    # regenerated them, backlog item 014). Pinned by digest, kept identical
    # to deploy-pages.yml's own image so the two workflows never diverge
    # again — bump both together with the `@playwright/test` version in
    # package.json, and regenerate every baseline through the new image
    # before merging. Mirrors the sibling `character-viewer-web`/
    # `character-editor`/`stage-viewer-web` repos' own fix for this same
    # failure mode, and web-ui-kit's `.vibe/decisions/015`.
    #
    # Scoped to lint + the visual regression suite only (backlog item 011),
    # not the full `npm test` unit/smoke suite: several of those tests need
    # the `engine` WASM module, which has no published release build asset
    # yet (a separate, pre-existing gap — see
    # .vibe/decisions/008-visual-regression-fixture-serving-strategy.md).
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e # v1.62.1-noble
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit SHA, not a floating tag — matches
      # this org's existing CI convention (see web-ui-kit's verify.yml).
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx biome check .

      # Pinned exact release tags — bumped as a follow-up of each
      # producer's own /vibe:release, per roadmap's
      # .vibe/decisions/016-wasm-version-pinning-push-based-propagation.md.
      - name: Download character WASM release
        run: npm run wasm:download -- v0.8.0

      - name: Download stage WASM release
        run: npm run wasm:download:stage -- v0.12.0

      - name: Prepare visual test fixtures
        run: npm run prepare-visual-fixtures

      # Own step (backlog item 011 AC) — real browser screenshot comparison
      # against the committed baselines in tests/visual/**/*-snapshots/, not
      # part of the jsdom-based `npm test` suite.
      - name: Visual regression tests
        run: npm run test:visual

      - name: Upload visual regression diff
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-diff
          path: test-results/
          retention-days: 14
