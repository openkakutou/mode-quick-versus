name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  visual:
    # Pinned to a specific image, not `ubuntu-latest` — a periodic runner
    # image bump changes fontconfig/freetype/software-GL rendering and would
    # silently invalidate every committed visual-regression baseline below
    # with no code change on our side. Mirrors web-ui-kit's own
    # `.vibe/decisions/015-visual-regression-shared-preset-shape.md`.
    #
    # Scoped to lint + the visual regression suite only (backlog item 011),
    # not the full `npm test` unit/smoke suite: several of those tests need
    # the `engine` WASM module, which has no published release build asset
    # yet (a separate, pre-existing gap — see
    # .vibe/decisions/008-visual-regression-fixture-serving-strategy.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit SHA, not a floating tag — matches
      # this org's existing CI convention (see web-ui-kit's verify.yml).
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx biome check .

      # Pinned exact release tags — bumped as a follow-up of each
      # producer's own /vibe:release, per roadmap's
      # .vibe/decisions/016-wasm-version-pinning-push-based-propagation.md.
      - name: Download character WASM release
        run: npm run wasm:download -- v0.8.0

      - name: Download stage WASM release
        run: npm run wasm:download:stage -- v0.12.0

      - name: Prepare visual test fixtures
        run: npm run prepare-visual-fixtures

      # Keyed on the pinned @playwright/test version (package-lock.json) so
      # a version bump busts the cache instead of silently reusing a
      # mismatched browser build. Mirrors web-ui-kit's own verify.yml step.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Own step (backlog item 011 AC) — real browser screenshot comparison
      # against the committed baselines in tests/visual/**/*-snapshots/, not
      # part of the jsdom-based `npm test` suite.
      - name: Visual regression tests
        run: npm run test:visual

      - name: Upload visual regression diff
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-diff
          path: test-results/
          retention-days: 14
